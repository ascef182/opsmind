name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-lint-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: opsmind
          POSTGRES_PASSWORD: opsmind
          POSTGRES_DB: opsmind
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opsmind -d opsmind"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Dono das tabelas — só para migrations/seed (superuser, ignora RLS).
      DATABASE_URL: postgresql://opsmind:opsmind@localhost:5432/opsmind?schema=public
      # Runtime da API — role restrita, criada pelo passo "Create restricted
      # app role" abaixo. É essa que os testes e2e usam de fato.
      DATABASE_URL_APP: postgresql://opsmind_app:opsmind_app@localhost:5432/opsmind?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-only-secret-not-for-production-use-xx
      JWT_REFRESH_SECRET: ci-only-secret-not-for-production-use-yy

    steps:
      - uses: actions/checkout@v4

      # Sem `version:` aqui de propósito: a v4 lê a versão do campo
      # `packageManager` do package.json raiz. Fixar as duas ao mesmo tempo
      # faz a action recusar rodar ("Multiple versions of pnpm specified").
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @opsmind/database exec prisma generate

      # Mesma lacuna do passo "Create restricted app role" abaixo: `services:`
      # não monta os init scripts do Docker Compose local. A imagem
      # pgvector/pgvector já tem o binário da extensão, mas precisa do
      # `CREATE EXTENSION` rodar antes de qualquer migration que use o tipo
      # `vector` (Fase 4 — documents_rag). Sem isso: "type vector does not
      # exist" no meio do `migrate deploy`.
      - name: Enable pgvector extension
        run: pnpm --filter @opsmind/database exec prisma db execute --file ../../infra/docker/init/01-extensions.sql --url "$DATABASE_URL"

      - run: pnpm --filter @opsmind/database exec prisma migrate deploy

      # `services:` do GitHub Actions não monta volumes de init como o Docker
      # Compose local monta — precisa deste passo separado para a role
      # restrita (DATABASE_URL_APP) existir antes dos testes rodarem. Mesmo
      # script usado localmente (infra/docker/init/02-app-role.sql).
      - name: Create restricted app role for RLS
        run: pnpm --filter @opsmind/database exec prisma db execute --file ../../infra/docker/init/02-app-role.sql --url "$DATABASE_URL"

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm turbo run test:e2e
