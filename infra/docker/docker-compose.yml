name: opsmind

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: opsmind
      POSTGRES_PASSWORD: opsmind
      POSTGRES_DB: opsmind
    ports:
      - "5432:5432"
    volumes:
      - opsmind_postgres_data:/var/lib/postgresql/data
      - ./init/01-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
      - ./init/02-app-role.sql:/docker-entrypoint-initdb.d/02-app-role.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opsmind -d opsmind"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - opsmind_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Navegador stealth self-hosted usado pela fonte de scraping CAMOFOX (ver
  # packages/integrations/src/camofox-gateway.ts). Builda direto do
  # repositório oficial via git URL — não testado nesta sessão (build de
  # verdade não roda aqui); se o build a partir da URL falhar, ver o fallback
  # manual documentado em infra/docker/README.md.
  camofox:
    build:
      context: https://github.com/jo-inc/camofox-browser.git
    restart: unless-stopped
    ports:
      - "9377:9377"
    environment:
      CAMOFOX_PORT: "9377"
    # Não sabemos se a imagem final tem `curl` ou `wget` instalado (build via
    # URL git, não inspecionado nesta sessão — ver ressalva acima) — tenta os
    # dois; se nenhum existir, o healthcheck falha sempre e o serviço fica
    # "unhealthy" mesmo up, o que ainda é mais honesto que não ter healthcheck
    # nenhum. Mesmos `interval`/`timeout`/`retries` de `postgres`/`redis`.
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:9377/ >/dev/null 2>&1 || curl -fsS http://localhost:9377/ >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  opsmind_postgres_data:
  opsmind_redis_data:
